<body>

  </ul>

    <i class="menuIcon material-icons">menu</i>

<header>
<img src="images/finally.png" alt="phoneix">
<h1 class="slide-up"> Get in touch with us!</h1>
    <br>

    <br>
<center>
<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdEF7fpAzhkyH2v-4LhfMEUYffZOT1Tr6Q1J2dBZ_cY4lnhAA/viewform?embedded=true" width="1000" height="958" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
</center>


</header>

   <div class="chat-box">
    <div class="chat-box-header">
      <h3>Message Us</h3>
      <p id="close-btn">&times;</p>
    </div>

    <div class="chat-box-body">
      <div class="message bot">Hello! How can I help you today?</div>
      <div class="message user">Hi! I want to know more about your services.</div>
    </div>

    <div class="chat-box-footer">
      <input id="userInput" type="text" placeholder="Type your message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="chat-button" id="chatBtn">💬 Chat</div>



<script>

const menu = document.querySelector(".menu");
const menuItems = document.querySelectorAll(".menuItem");
const hamburger= document.querySelector(".hamburger");
const closeIcon= document.querySelector(".closeIcon");
const menuIcon = document.querySelector(".menuIcon");

function toggleMenu() {
  if (menu.classList.contains("showMenu")) {
    menu.classList.remove("showMenu");
    closeIcon.style.display = "none";
    menuIcon.style.display = "block";
  } else {
    menu.classList.add("showMenu");
    closeIcon.style.display = "block";
    menuIcon.style.display = "none";
  }
}

hamburger.addEventListener("click", toggleMenu);

menuItems.forEach(
  function(menuItem) {
    menuItem.addEventListener("click", toggleMenu);
  }
)

    const menu = document.querySelector(".menu");
const menuItems = document.querySelectorAll(".menuItem");
const hamburger= document.querySelector(".hamburger");
const closeIcon= document.querySelector(".closeIcon");
const menuIcon = document.querySelector(".menuIcon");

function toggleMenu() {
  if (menu.classList.contains("showMenu")) {
    menu.classList.remove("showMenu");
    closeIcon.style.display = "none";
    menuIcon.style.display = "block";
  } else {
    menu.classList.add("showMenu");
    closeIcon.style.display = "block";
    menuIcon.style.display = "none";
  }
}

hamburger.addEventListener("click", toggleMenu);

menuItems.forEach(
  function(menuItem) {
    menuItem.addEventListener("click", toggleMenu);
  }
)

// Toggle Chatbox Visibility
const chatBox = document.querySelector('.chat-box');
const chatBtn = document.getElementById('chatBtn');
const closeBtn = document.getElementById('close-btn');
const sendBtn = document.getElementById('sendBtn');
const userInput = document.getElementById('userInput');
const chatBody = document.querySelector('.chat-box-body');

chatBtn.addEventListener('click', () => {
  chatBox.style.display = 'flex';
  chatBtn.style.display = 'none';
});

closeBtn.addEventListener('click', () => {
  chatBox.style.display = 'none';
  chatBtn.style.display = 'block';
});

// Handle Sending Messages
sendBtn.addEventListener('click', () => {
  const text = userInput.value.trim();
  if (text === '') return;

  const userMessage = document.createElement('div');
  userMessage.classList.add('message', 'user');
  userMessage.textContent = text;
  chatBody.appendChild(userMessage);

  userInput.value = '';

  // Fake bot reply
  const botMessage = document.createElement('div');
  botMessage.classList.add('message', 'bot');
  botMessage.textContent = 'Thanks for your message!';
  chatBody.appendChild(botMessage);

  chatBody.scrollTop = chatBody.scrollHeight;
});

</script>

</body>
</html>
